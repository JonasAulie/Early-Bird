name: Early Bird scan

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if outside the 3 target Oslo-time slots (for manual testing)"
        type: boolean
        default: false
  schedule:
    # UTC times covering Oslo 07:32 / 08:02 / 16:00 across both CET
    # (winter, UTC+1) and CEST (summer, UTC+2). schedule_guard.py no-ops
    # any firing that isn't actually close to a target Oslo time (and, for
    # 16:00, the right weekday), so this looks like more firings than we
    # want but most are cheap skips. This is a free backup only -- the
    # primary trigger is external cron-job.org calls to workflow_dispatch,
    # see README "Backup-trigger" section.
    - cron: "32 5 * * *"
    - cron: "2 6 * * *"
    - cron: "32 6 * * *"
    - cron: "2 7 * * *"
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --no-build-isolation -r requirements.txt

      - name: Install headless browser (Playwright Chromium)
        run: playwright install --with-deps chromium

      - name: Run Early Bird scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FORCE_RUN: ${{ inputs.force }}
        run: python -m src.main

