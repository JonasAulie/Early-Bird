name: Probe URLs (debug tool)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/probe_newsweb_api.py
      - run: python scripts/discover_ir_urls.py
      - uses: actions/upload-artifact@v4
        with:
          name: discover-results
          path: discover_results.json
